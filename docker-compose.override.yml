services:
  backend:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
    container_name: ecommerce-backend
    command: java -jar /app/app.jar
    ports:
      - "8000:8000"
    environment:
      PG_DSN: postgresql://ecommerce:ecommerce@postgres:5432/ecommerce
      MONGO_DSN: mongodb://mongo:27017
      MONGO_DB_NAME: ecommerce
      ES_URL: http://elasticsearch:9200
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # The integration tests in backend-java run on the host (via Maven) and need a
  # real PostgreSQL. Port 5432 on this host is already taken by a native
  # PostgreSQL install, so the container also publishes 55433 for the test
  # suite to connect to. The application itself still uses the in-network 5432.
  postgres-test-port:
    image: alpine/socat
    container_name: ecommerce-postgres-proxy
    depends_on:
      - postgres
    entrypoint: ["sh", "-c", "apk add --no-cache socat >/dev/null 2>&1; exec socat TCP-LISTEN:5432,fork,reuseaddr TCP:postgres:5432"]
    ports:
      - "55433:5432"
    restart: unless-stopped
